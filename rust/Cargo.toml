[package]
name = "github-copilot"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["stdio", "tcp"]
stdio = []
tcp = ["dep:regex"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = { version = "1", optional = true }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
anyhow = "1"
